<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="50%" stop-color="#241442"/>
      <stop offset="100%" stop-color="#180e29"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bgGrad)"/>
  
  <rect x="30" y="30" width="940" height="640" rx="16" fill="none" stroke="url(#goldGrad2)" stroke-width="3" stroke-dasharray="10 5"/>
  <rect x="45" y="45" width="910" height="610" rx="12" fill="#130b21" fill-opacity="0.9" stroke="url(#roseGrad)" stroke-width="1.5"/>

  <path d="M 50 100 L 50 50 L 100 50" fill="none" stroke="url(#goldGrad2)" stroke-width="4"/>
  <path d="M 950 100 L 950 50 L 900 50" fill="none" stroke="url(#goldGrad2)" stroke-width="4"/>
  <path d="M 50 600 L 50 650 L 100 650" fill="none" stroke="url(#goldGrad2)" stroke-width="4"/>
  <path d="M 950 600 L 950 650 L 900 650" fill="none" stroke="url(#goldGrad2)" stroke-width="4"/>

  <text x="500" y="115" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#fb7185" text-anchor="middle" letter-spacing="4">INSTITUTIONAL RECOGNITION</text>
  
  <text x="500" y="175" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">LEADERSHIP EXCELLENCE AWARD</text>
  
  <line x1="380" y1="195" x2="620" y2="195" stroke="url(#goldGrad2)" stroke-width="3"/>
  <circle cx="500" cy="195" r="5" fill="#fbbf24"/>

  <text x="500" y="245" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-style="italic" fill="#94a3b8" text-anchor="middle">This honor is officially conferred upon</text>
  
  <text x="500" y="315" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="url(#goldGrad2)" text-anchor="middle">SHARATH A B</text>
  
  <line x1="280" y1="340" x2="720" y2="340" stroke="#334155" stroke-width="1.5"/>

  <text x="500" y="380" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">in appreciation of outstanding service as</text>
  <text x="500" y="425" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#fb7185" text-anchor="middle">Anti-Ragging Team Leader &amp; Event Coordinator</text>

  <text x="500" y="470" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle">For exceptional team governance, peer mentoring, campus welfare and successful collegiate event operations (BCA 2 Years)</text>

  <g transform="translate(500, 560)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#goldGrad2)" stroke-width="3"/>
    <circle cx="0" cy="0" r="38" fill="#1f1136" stroke="#fbbf24" stroke-width="1"/>
    <text x="0" y="-8" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#fb7185" text-anchor="middle">CAMPUS</text>
    <text x="0" y="6" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle">HONOR</text>
    <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#fbbf24" text-anchor="middle">LEADERSHIP</text>
  </g>

  <g transform="translate(180, 560)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="-12" font-family="'Brush Script MT', cursive, sans-serif" font-size="22" fill="#e2e8f0" text-anchor="middle">Head of Department</text>
    <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">COLLEGE PRINCIPAL / HOD</text>
    <text x="0" y="34" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">SSCASC, Tumkur</text>
  </g>

  <g transform="translate(820, 560)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="-12" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#fb7185" text-anchor="middle">SSCASC-LEAD-2023</text>
    <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">RECORD NUMBER</text>
    <text x="0" y="34" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Tenure: 2021 – 2024</text>
  </g>
</svg>
