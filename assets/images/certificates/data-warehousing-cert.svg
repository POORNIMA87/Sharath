  <text x="500" y="115" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="4">COURSERA SPECIALIZATION</text>
  
  <text x="500" y="175" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">CERTIFICATE OF ACHIEVEMENT</text>
  
  <line x1="380" y1="195" x2="620" y2="195" stroke="url(#tealGrad)" stroke-width="3"/>
  <circle cx="500" cy="195" r="5" fill="#10b981"/>

  <text x="500" y="245" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-style="italic" fill="#94a3b8" text-anchor="middle">This certificate is awarded to</text>
  
  <text x="500" y="315" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="url(#tealGrad)" text-anchor="middle">SHARATH A B</text>
  
  <line x1="280" y1="340" x2="720" y2="340" stroke="#334155" stroke-width="1.5"/>

  <text x="500" y="380" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">for successfully demonstrating mastery in</text>
  <text x="500" y="425" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#a78bfa" text-anchor="middle">Fundamentals of Data Warehousing</text>

  <text x="500" y="470" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle">Covering ETL Pipelines, Star &amp; Snowflake Schema Architecture, SQL Modeling &amp; OLAP Databases</text>

