  <rect width="1000" height="700" fill="url(#bgGrad)"/>
  
  <rect x="30" y="30" width="940" height="640" rx="16" fill="none" stroke="url(#tealGrad)" stroke-width="3" stroke-dasharray="10 5"/>
  <rect x="45" y="45" width="910" height="610" rx="12" fill="#0b1329" fill-opacity="0.88" stroke="url(#purpleGrad)" stroke-width="1.5"/>

  <path d="M 50 100 L 50 50 L 100 50" fill="none" stroke="url(#tealGrad)" stroke-width="4"/>
  <path d="M 950 100 L 950 50 L 900 50" fill="none" stroke="url(#tealGrad)" stroke-width="4"/>
  <path d="M 50 600 L 50 650 L 100 650" fill="none" stroke="url(#tealGrad)" stroke-width="4"/>
