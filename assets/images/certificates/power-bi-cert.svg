<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)"/>
  
  <!-- Outer Border -->
  <rect x="30" y="30" width="940" height="640" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 5"/>
  <rect x="45" y="45" width="910" height="610" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="url(#cyanGrad)" stroke-width="1.5"/>

  <!-- Corner Ornaments -->
  <path d="M 50 100 L 50 50 L 100 50" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <path d="M 950 100 L 950 50 L 900 50" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <path d="M 50 600 L 50 650 L 100 650" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <path d="M 950 600 L 950 650 L 900 650" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Organization Badge / Header -->
  <text x="500" y="115" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#06b6d4" text-anchor="middle" letter-spacing="4">COURSERA VERIFIED CERTIFICATE</text>
  
  <text x="500" y="175" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">CERTIFICATE OF COMPLETION</text>
  
  <line x1="380" y1="195" x2="620" y2="195" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="500" cy="195" r="5" fill="#f59e0b"/>

  <text x="500" y="245" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-style="italic" fill="#94a3b8" text-anchor="middle">This is proudly presented to</text>
  
  <!-- Recipient Name -->
  <text x="500" y="315" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="url(#goldGrad)" text-anchor="middle">SHARATH A B</text>
  
  <line x1="280" y1="340" x2="720" y2="340" stroke="#334155" stroke-width="1.5"/>

  <!-- Course Title -->
  <text x="500" y="380" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">for successfully completing the specialized course</text>
  <text x="500" y="425" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#38bdf8" text-anchor="middle">Building Data Visualization and Reports using Power BI</text>

  <!-- Description / Skills -->
  <text x="500" y="470" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle">Demonstrating practical proficiency in Data Modeling, DAX Queries, Interactive Dashboards &amp; Business Intelligence</text>

  <!-- Seal / Emblem -->
  <g transform="translate(500, 560)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="38" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="-8" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#f59e0b" text-anchor="middle">OFFICIAL</text>
    <text x="0" y="6" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle">VERIFIED</text>
    <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#06b6d4" text-anchor="middle">CREDENTIAL</text>
  </g>

  <!-- Signatures & Details -->
  <g transform="translate(180, 560)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="-12" font-family="'Brush Script MT', cursive, sans-serif" font-size="22" fill="#e2e8f0" text-anchor="middle">Coursera Instructor</text>
    <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">AUTHORIZED INSTRUCTOR</text>
    <text x="0" y="34" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Cognifyz &amp; Coursera Partner</text>
  </g>

  <g transform="translate(820, 560)">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="-12" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">CRS-PWRBI-2025</text>
    <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">CREDENTIAL ID</text>
    <text x="0" y="34" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Issued: August 2025</text>
  </g>
</svg>
